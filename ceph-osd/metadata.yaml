name: ceph-osd
summary: Highly scalable distributed storage - Ceph OSD storage
maintainer: OpenStack Charmers <openstack-charmers@lists.ubuntu.com>
provides:
  nrpe-external-master:
    interface: nrpe-external-master
    scope: container
    optional: true
tags:
- openstack
- storage
- file-servers
- misc
series:
- noble
description: |
  Ceph is a distributed storage and network file system designed to provide
  excellent performance, reliability, and scalability.
  .
  This charm provides the Ceph OSD personality for expanding storage capacity
  within a ceph deployment.
docs: https://discourse.charmhub.io/t/ceph-osd-docs-index/10545
extra-bindings:
  public:
  cluster:
resources:
  epa-orchestrator:
    type: file
    filename: epa-orchestrator.snap
    description: |
      EPA orchestrator snap used to allocate CPUs for OSD resource profiles.
      When no resource is attached the charm installs the snap from the store
      channel given by the `epa-orchestrator-channel` config option. An EPA
      orchestrator that is already installed on the host is used as-is.
peers:
  resource-peers:
    interface: ceph-osd-resource-rollout
requires:
  mon:
    interface: ceph-osd
  secrets-storage:
    interface: vault-kv
    optional: true
storage:
  osd-devices:
    type: block
    multiple:
      range: 0-
    minimum-size: 1G
  osd-journals:
    type: block
    multiple:
      range: 0-
  bluestore-db:
    type: block
    multiple:
      range: 0-
  bluestore-wal:
    type: block
    multiple:
      range: 0-
  cache-devices:
    type: block
    multiple:
      range: 0-
    minimum-size: 10G
