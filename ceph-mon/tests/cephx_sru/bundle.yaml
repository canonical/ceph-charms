# Disposable compatibility lab: one monitor/manager, two OSDs, one MDS, one client.
# Two OSD hosts let the charms create replicated CephFS pools without repair steps.
series: noble
machines:
  '0':
    constraints: cores=2 mem=2G root-disk=12G
  '1':
    constraints: cores=2 mem=4G root-disk=24G virt-type=virtual-machine
  '2':
    constraints: cores=2 mem=4G root-disk=16G virt-type=virtual-machine
  '3':
    constraints: arch=amd64 cores=1 mem=2G root-disk=12G
  '4':
    constraints: cores=2 mem=4G root-disk=24G virt-type=virtual-machine
applications:
  ceph-mon:
    charm: ch:ceph-mon
    channel: latest/edge
    revision: 724
    num_units: 1
    options:
      source: ppa:johnramsden/noble-caracal-ceph-squid-sru
      monitor-count: 1
      expected-osd-count: 2
      config-flags: '{"global": {"osd pool default size": 2, "osd pool default min size": 1}}'
    to: ['0']
  ceph-osd:
    charm: ch:ceph-osd
    channel: latest/edge
    revision: 1090
    num_units: 2
    options:
      source: ppa:johnramsden/noble-caracal-ceph-squid-sru
      tune-osd-memory-target: 2GB
    storage:
      osd-devices: 'loop,8G'
    to: ['1', '4']
  ubuntu:
    charm: ch:ubuntu
    channel: latest/stable
    revision: 79
    num_units: 1
    to: ['2']
  ceph-fs:
    charm: ch:ceph-fs
    channel: latest/edge
    revision: 535
    num_units: 1
    options:
      source: ppa:johnramsden/noble-caracal-ceph-squid-sru
      ceph-osd-replication-count: 2
      mds-cache-memory-limit: 512Mi
    to: ['3']
relations:
  - - ceph-osd:mon
    - ceph-mon:osd
  - - ceph-fs:ceph-mds
    - ceph-mon:mds
